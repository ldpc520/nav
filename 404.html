<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f8f9ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 404渐变文字 + 浮动动画 */
        .four-zero-four {
            font-size: 180px;
            font-weight: 900;
            background: linear-gradient(120deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            color: transparent;
            animation: float 3s ease-in-out infinite;
            line-height: 1;
        }

        .tips-title {
            font-size: 26px;
            color: #333;
            margin: 15px 0 10px;
            letter-spacing: 2px;
        }

        .tips-text {
            color: #999;
            font-size: 16px;
            margin-bottom: 40px;
        }

        /* 简约按钮样式 */
        .home {
            padding: 13px 38px;
            background: linear-gradient(120deg, #6366f1, #8b5cf6);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }

        .home:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
        }

        /* 浮动动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="four-zero-four">404</div>
    <h2 class="tips-title">糟糕！页面迷路了</h2>
    <p class="tips-text">抱歉，当前访问的页面不存在，请检查链接</p >
    <a href="https://blds.ccwu.cc/" class="home">返回首页</a >
</body>
</html>
